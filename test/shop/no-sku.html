<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summer Cotton Dress – Blue | Nordic Thread (demo shop, no product number)</title>
  <!-- A made-up webshop page for trying the inspector. This variant shows no product number at all (no SKU, EAN or
       item number), so the product has to be found from its name and facts. It matches
       the stand-in PIM in ../mock-pim.js, except "Care instructions", which is deliberately out of date. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Summer Cotton Dress – Blue",
    "brand": { "@type": "Brand", "name": "Nordic Thread" },
    "color": "Blue",
    "offers": { "@type": "Offer", "price": "79.00", "priceCurrency": "EUR", "availability": "https://schema.org/InStock" }
  }
  </script>
  <style>
    :root { --ink: #1f2430; --muted: #6b7280; --line: #e5e7eb; --accent: #1d4f91; --bg: #fbfaf8; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 Georgia, "Times New Roman", serif; color: var(--ink); background: var(--bg); }
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--line); background: #fff; font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
    header b { letter-spacing: .12em; text-transform: uppercase; font-size: 14px; }
    header nav { color: var(--muted); font-size: 13px; }
    main { max-width: 880px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 28px; }
    .photo { aspect-ratio: 4 / 5; border-radius: 10px; background: linear-gradient(160deg, #9fc0e6, #4f7fc0 60%, #2e5a9c); display: grid; place-items: center; color: #fff; font: 600 13px -apple-system, Arial, sans-serif; letter-spacing: .1em; }
    h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; }
    .sku { color: var(--muted); font: 13px -apple-system, Arial, sans-serif; }
    .price { font-size: 22px; margin: 14px 0; }
    .buy { font: 600 14px -apple-system, Arial, sans-serif; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 11px 22px; }
    .delivery { color: var(--muted); font: 13px -apple-system, Arial, sans-serif; margin-top: 10px; }
    h2 { font-size: 15px; font-family: -apple-system, Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; margin: 26px 0 8px; }
    table { width: 100%; border-collapse: collapse; font: 14px -apple-system, "Segoe UI", Arial, sans-serif; }
    th, td { text-align: left; padding: 8px 4px; border-top: 1px solid var(--line); vertical-align: top; }
    th { width: 42%; color: var(--muted); font-weight: 400; }
    @media (max-width: 640px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><b>Nordic Thread</b><nav>Women · Dresses · Summer</nav></header>
  <main>
    <div class="photo">PRODUCT PHOTO</div>
    <div>
      <h1>Summer Cotton Dress – Blue</h1>
      <div class="price">€79.00</div>
      <button class="buy" type="button">Add to bag</button>
      <p class="delivery">Delivery: 2–4 working days</p>
      <p>A light summer dress in organic cotton.</p>

      <h2>Details</h2>
      <table>
        <tr><th>Material</th><td>100% organic cotton</td></tr>
        <tr><th>Colour</th><td>Blue</td></tr>
        <tr><th>Size</th><td>M</td></tr>
        <tr><th>Fit</th><td>Regular fit</td></tr>
        <tr><th>Weight</th><td>180 g</td></tr>
        <tr><th>Care instructions</th><td>Machine wash at 40°C</td></tr>
        <tr><th>Brand</th><td>Nordic Thread</td></tr>
      </table>
    </div>
  </main>
  <script src="../harness/lens-boot.js"></script>
</body>
</html>
